[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofkey-runtime"
version = "0.1.0"
description = "Offline ProofKey adaptive logistics contract harness"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic==2.13.5"]

[tool.setuptools.packages.find]
where = ["src"]
