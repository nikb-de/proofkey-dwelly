[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofkey-runtime"
version = "0.1.0"
description = "Offline ProofKey adaptive logistics contract harness"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic==2.13.5", "pillow==12.3.0", "pypdf==6.10.0"]

[project.optional-dependencies]
api = ["fastapi==0.143.0", "starlette==1.7.0", "uvicorn==0.54.0"]
api-test = ["httpx==0.28.1"]

[project.scripts]
proofkey = "proofkey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
