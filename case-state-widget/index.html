<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кейсы · JSON + движок визуализации</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7f8,#111719);--fg:light-dark(#202a31,#e6edf0);--surface:light-dark(#fff,#192125);--border:light-dark(#dce3e7,#38484f);--muted:light-dark(#62727c,#a6b8bf)}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;background:var(--bg);color:var(--fg)}.loader{max-width:1544px;margin:16px auto 0;padding:0 24px}.load-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,.upload{font:inherit;padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);cursor:pointer}button:disabled{opacity:.4}.upload{position:relative}.upload:focus-within{outline:2px solid #5a979b}.upload input{position:absolute;width:1px;height:1px;opacity:0}.status{font-size:12px;color:var(--muted)}details{margin-top:9px}summary{cursor:pointer;font-size:12px;color:var(--muted)}textarea{display:block;margin:10px 0;width:100%;min-height:250px;padding:12px;font:12px/1.5 ui-monospace,monospace;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:8px}#load-error{color:light-dark(#a42d21,#ffb3a6);font-size:13px;margin:8px 0}a{color:inherit}.hint{font-size:12px;color:var(--muted);margin-left:auto}case-state-viewer{display:block}
</style><script type="module" src="./app.js"></script></head>
<body><section class="loader" aria-label="Загрузка данных"><div class="load-row"><label class="upload">Загрузить JSON<input type="file" id="file" accept=".json,application/json" aria-label="Загрузить JSON"></label><button id="download" type="button" disabled>Скачать JSON</button><span class="status" id="load-status" role="status">Загружается JSON…</span><span class="hint">Файл обрабатывается в браузере</span></div><p id="load-error" role="alert"></p><details id="editor"><summary>Посмотреть / вставить JSON</summary><textarea id="json-input" aria-label="JSON кейса" spellcheck="false"></textarea><button id="apply-json" type="button">Применить JSON</button></details></section><case-state-viewer></case-state-viewer></body></html>
