<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d3e23">
  <title>Right onTime — Delivery help</title>
  <link rel="stylesheet" href="/showcase.css">
  <script type="module" src="/showcase.js"></script>
</head>
<body>
  <main class="showcase-layout">
    <aside class="story-rail" aria-label="About this replay">
      <a class="brand" href="/showcase.html" aria-label="Right onTime replay home"><img src="/brand/forward-forest.svg" width="187" height="32" alt="Right onTime"></a>
      <p class="overline">Delivery, with understanding.</p>
      <h1>Plans change.<br>Stay in sync.</h1>
      <p class="story-intro">A request becomes a clear offer, then a booking everyone can agree on.</p>
      <nav class="journey" aria-label="Replay scenes" id="journey-navigation"></nav>
      <p class="rail-footnote">A recorded product demo.<br>Powered by ProofKey.</p>
    </aside>
    <section class="presentation" aria-label="Recorded delivery coordination">
      <div class="device-frame">
        <span class="device-button device-button-volume" aria-hidden="true"></span><span class="device-button device-button-power" aria-hidden="true"></span>
        <div class="phone-screen">
          <div class="status-bar" aria-hidden="true"><span>9:41</span><div class="camera-island"></div><span class="status-icons"><svg viewBox="0 0 34 12"><path d="M1 10V8M5 10V6M9 10V3M13 10V1"/><path d="M18 4c3-3 7-3 10 0m-8 3c2-2 4-2 6 0m-4 3h2"/></svg><span class="battery"></span></span></div>
          <article id="replay-stage" data-scene="1" aria-live="polite" aria-atomic="true"><div class="loading-state"><span class="loading-mark" aria-hidden="true"></span><p>Opening your delivery…</p></div></article>
        </div>
      </div>
      <div class="replay-tools">
        <div class="presentation-heading"><span id="perspective-label">Customer view</span><span id="mode-label">Loading recording</span></div>
        <div class="playback">
          <div class="playback-top"><button id="play-replay" class="play-button" disabled>Play replay</button><p id="playback-status">5 scenes · 40 seconds</p><div class="scene-arrows"><button id="previous-scene" class="icon-button" aria-label="Previous scene" disabled>←</button><button id="next-scene" class="icon-button" aria-label="Next scene" disabled>→</button></div></div>
          <div id="scene-progress" class="scene-progress" aria-label="Replay progress"></div>
        </div>
      </div>
      <details class="evidence-details" id="evidence-details"><summary><span>Recording &amp; source details</span><span aria-hidden="true">+</span></summary><div id="evidence-content"></div></details>
    </section>
  </main>
</body>
</html>
