<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">ProofKey: what is connected today</title>
  <desc id="desc">Architecture baseline 3d08cd3 on 10 October 2026, with separately updated private cloud-pilot acceptance. The verified local path is trusted CLI to case API to PostgreSQL to pinned export to decision-input JSON. Browser workbench, model and three judges, deterministic runtime and team dataset are implemented separately. There is no connected outbox consumer, browser BFF, server media upload or real operational adapter. A private IAM-protected Cloud Run case API now connects to regional-HA Cloud SQL in europe-west2, with versioned credentials in Secret Manager. Five HTTPS acceptance runs on one synthetic case passed 100 checks, including fresh-revision redeployment and rollback. Accepted revision 00002 serves all traffic; Ready and RoutesReady are true. This is a live private case-storage pilot. The full product is not ready, no live model or operational integration is deployed, and disaster-recovery restore is untested. New local release verification records 411 tests and 647 subtests, including 17 offline cloud-smoke unit tests, plus eight live database-permission checks. Historical local receipts record 375 tests, 487 subtests and 45 ARM64 Docker checks, separate from cloud acceptance.</desc>
  <metadata>Evidence: docs/architecture/postgres-case-backend.md; docs/verification/postgres-integration-report.md; docs/verification/postgres-deploy-report.md; tools/dwelly_model/README.md; runtime/README.md; datasets/team-handoff-v1/README.md; design/right-ontime/prototype/INTAKE-README.md; deploy/cloud-run/production-readiness.md; docs/verification/cloud-case-pilot-2026-10-10.md; coordinator live acceptance report. Architecture baseline: 3d08cd3. Private pilot: genaide/europe-west2; Cloud Run proofkey-case-api revision 00002 at 100 percent traffic; revision 00003 candidate tag at 0 percent; regional-HA Cloud SQL proofkey-case-pg; image sha256:9e53394d896b6db76e61597d973b91afc851c705f61639ae1682a3500e1f032e. Ready=True and RoutesReady=True at 2026-10-10T12:17:05Z. IAM invocation required; no allUsers grant. Five HTTPS runs of 20 checks on one synthetic case passed, including revision 00003 and rollback to 00002. On-demand backup succeeded; restore and failover drills not performed.</metadata>
